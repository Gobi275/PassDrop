<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>PassDrop•</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="img/icon.svg">
</head>
<body>
<div class="background-layer" id="bg1"></div>
<div class="background-layer" id="bg2"></div>
<div class="all">
    <img id="logo" class="logo" src="img/logo.svg" alt="PassDrop Logo" />

    <!-- Tabs + Inhalt getrennt -->
    <div class="tab-section">
        <!-- Tab-Leiste -->
        <div class="tab-container-wrapper">
            <div class="tab-container">
                <input type="radio" name="tab" id="tab1" class="tab tab--1" checked />
                <label class="tab_label" for="tab1">Generator</label>

                <input type="radio" name="tab" id="tab2" class="tab tab--2" />
                <label class="tab_label" for="tab2">Inspector</label>

                <input type="radio" name="tab" id="tab3" class="tab tab--3" />
                <label class="tab_label" for="tab3">Tips</label>

                <div class="indicator"></div>
            </div>
        </div>

        <!-- Inhalte – außerhalb der Tab-Leiste -->
        <div class="main-container tab-content tab-content--1">
            <div class="output-area">
                <div class="title">Drop dein Passwort – stark, zufällig, sicher.</div>

                <div class="output-container">
                    <input type="text" id="password" readonly />
                    <div class="strength-indicator">
                        <img src="img/status.svg" alt="Stärkeindikator" />
                    </div>
                    <button onclick="copyPassword()" class="svg-button copy-button">
                        <img src="img/copy-button.svg" class="btn-img normal" alt="Kopieren" />
                        <img src="img/copy-button-hover.svg" class="btn-img hover" alt="Kopieren Hover" />
                        <img src="img/done.svg" class="btn-img done" alt="Kopiert!" />
                    </button>
                </div>

                <div class="settings-row">
                    <div class="slider-block">
                        <label for="lengthSlider">Länge: <span id="lengthValue">12</span></label>
                        <input type="range" min="4" max="32" value="12" id="lengthSlider" />
                    </div>

                    <div class="checkboxes">
                        <div class="checkbox-wrapper-15">
                            <input class="inp-cbx rule-checkbox" id="includeNumbers" type="checkbox" checked style="display: none;" />
                            <label class="cbx" for="includeNumbers">
                                <span><svg width="12px" height="9px" viewBox="0 0 12 9"><polyline points="1 5 4 8 11 1"></polyline></svg></span>
                                <span>Zahlen</span>
                            </label>
                        </div>
                        <div class="checkbox-wrapper-15">
                            <input class="inp-cbx rule-checkbox" id="includeSymbols" type="checkbox" checked style="display: none;" />
                            <label class="cbx" for="includeSymbols">
                                <span><svg width="12px" height="9px" viewBox="0 0 12 9"><polyline points="1 5 4 8 11 1"></polyline></svg></span>
                                <span>Sonderzeichen</span>
                            </label>
                        </div>
                        <div class="checkbox-wrapper-15">
                            <input class="inp-cbx rule-checkbox" id="includeUppercase" type="checkbox" checked style="display: none;" />
                            <label class="cbx" for="includeUppercase">
                                <span><svg width="12px" height="9px" viewBox="0 0 12 9"><polyline points="1 5 4 8 11 1"></polyline></svg></span>
                                <span>Großbuchstaben</span>
                            </label>
                        </div>
                        <div class="checkbox-wrapper-15">
                            <input class="inp-cbx rule-checkbox" id="includeLowercase" type="checkbox" checked style="display: none;" />
                            <label class="cbx" for="includeLowercase">
                                <span><svg width="12px" height="9px" viewBox="0 0 12 9"><polyline points="1 5 4 8 11 1"></polyline></svg></span>
                                <span>Kleinbuchstaben</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="generate-button-wrapper">
                    <button onclick="generatePassword()" class="svg-button generate-button">
                        <img src="img/generate.svg" class="btn-img normal" alt="Generieren" />
                        <img src="img/generate-hover.svg" class="btn-img hover" alt="Generieren Hover" />
                    </button>
                </div>
            </div>
        </div>

        <div class="main-container tab-content tab-content--2">
            <div class="output-area inspector-area">
                <div class="title">Dein Passwort im Test</div>

                <div class="output-container inspector-input-row">
                    <input type="password" id="inspectInput" placeholder="Gib hier dein Passwort ein…"  />
                </div>

                <div class="advise" id="adviseText">🔒 Sicherheitsinformationen</div>

                <div class="score">
                    <div class="loader">
                        <span></span>
                    </div>
                </div>
            </div>
        </div>


        <div class="main-container tab-content tab-content--3">
            <div class="heading">
                <img src="img/tips.png" class="icon-big" alt="Tips" />
                <h2 class="tips-title">Tips</h2>
            </div>
            <div class="tips-over-container">
                <div class="tips-container">
                    <img id="twofaIcon" src="img/2fa.png" class="tips-icon" alt="2FA" />
                    <img id="personalIcon" src="img/personal-info.png" class="tips-icon" alt="Keine persönlichen Daten" />
                    <img id="wordsIcon" src="img/words.png" class="tips-icon" alt="Vermeide bekannte Wörter" />
                    <img id="pwmanagerIcon" src="img/passwordmanager.png" class="tips-icon" alt="Passwortmanager" />
                    <img id="keysIcon" src="img/keys.png" class="tips-icon" alt="Eigene Passwörter je Dienst" />
                </div>
                <div class="tips-container">
                    <img id="atwoIcon" src="img/a2.png" class="tips-icon" alt="Alle Zeichenarten nutzen" />
                    <img id="calendarIcon" src="img/calendar.png" class="tips-icon" alt="Nur bei Bedarf ändern" />
                    <img id="phraseIcon" src="img/passphrase.png" class="tips-icon" alt="Passphrasen verwenden" />
                    <img id="qwertzIcon" src="img/qwertz.png" class="tips-icon" alt="Muster & Wiederholungen vermeiden" />
                </div>
            </div>

        </div>
    </div>

    <!-- Theme Toggle -->
    <div class="theme-toggle-wrapper">
        <div class="checkbox-wrapper-54">
            <label class="switch">
                <input type="checkbox" id="themeToggle" checked />
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

<div id="privacyModal" class="modal">
    <div class="modal-content">
        <button class="close-button" id="closePrivacy">
            <img src="img/close.svg" class="close-img normal" alt="Schließen">
            <img src="img/close-hover.svg" class="close-img hover" alt="Schließen Hover">
        </button>
        <img src="img/icon01.svg" class="modal-icon" alt="shield icon">
        <h2>Deine Privatsphäre zählt</h2>
        <p>
            Dein Passwort verlässt niemals deinen Browser. <br>
            Es wird nicht gespeichert, gesendet oder analysiert. <br>
            Alles passiert lokal auf deinem Gerät.
        </p>
    </div>
</div>

<div id="tipModal" class="modal">
    <div class="modal-content">
        <button class="close-button" id="closeTip">
            <img src="img/close.svg" class="close-img normal" alt="Schließen">
            <img src="img/close-hover.svg" class="close-img hover" alt="Schließen Hover">
        </button>
        <img id="modalIcon" class="modal-icon" alt="Tipp-Icon">
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
    </div>
</div>

<script>
    let currentTabIndex = 1;

    function copyPassword() {
        const input = document.getElementById("password");
        navigator.clipboard.writeText(input.value).then(() => {
            const button = document.querySelector(".svg-button");
            const normalImg = button.querySelector(".btn-img.normal");
            const hoverImg = button.querySelector(".btn-img.hover");

            // Temporär auf done.svg wechseln
            normalImg.src = "img/done.svg";
            hoverImg.src = "img/done.svg";

            setTimeout(() => {
                normalImg.src = "img/copy-button.svg";
                hoverImg.src = "img/copy-button-hover.svg";
            }, 1000);
        });
    }

    const lengthSlider = document.getElementById("lengthSlider");
    const lengthValue = document.getElementById("lengthValue");

    lengthSlider.addEventListener("input", () => {
        lengthValue.textContent = lengthSlider.value;
    });

    function generatePassword() {
        const length = lengthSlider.value;
        const includeNumbers = document.getElementById("includeNumbers").checked;
        const includeSymbols = document.getElementById("includeSymbols").checked;
        const includeUppercase = document.getElementById("includeUppercase").checked;
        const includeLowercase = document.getElementById("includeLowercase").checked;

        const numbers = "0123456789";
        const symbols = "!@#$%^&*()_+[]{}|;:,.<>?";
        const lowercase = "abcdefghijklmnopqrstuvwxyz";
        const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        let charset = "";
        if (includeNumbers) charset += numbers;
        if (includeSymbols) charset += symbols;
        if (includeUppercase) charset += uppercase;
        if (includeLowercase) charset += lowercase;

        let password = "";
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * charset.length);
            password += charset[randomIndex];
        }

        document.getElementById("password").value = password;
        updateStrengthIndicator(password);
    }

    function updateStrengthIndicator(password) {
        const indicator = document.querySelector(".strength-indicator img");

        const hasLower = /[a-z]/.test(password);
        const hasUpper = /[A-Z]/.test(password);
        const hasNumber = /[0-9]/.test(password);
        const hasSymbol = /[^a-zA-Z0-9]/.test(password);
        const length = password.length;

        const types = [hasLower, hasUpper, hasNumber, hasSymbol].filter(Boolean).length;

        let strength = "sehr-schwach.svg";

        if (types < 2 || length < 6) {
            strength = "sehr-schwach.svg";
        } else if (types >= 2 && length >= 6) {
            strength = "schwach.svg";
        }
        if (types >= 3 && length >= 8) {
            strength = "mittel.svg";
        }
        if ((types === 4 && length >= 11) || (types === 3 && length >= 14)) {
            strength = "sicher.svg";
        }
        if ((types === 4 && length >= 14) || (types === 3 && length >= 16)) {
            strength = "sehr-sicher.svg";
        }

        indicator.src = `img/${strength}`;
    }

    const checkboxes = document.querySelectorAll('.rule-checkbox');

    checkboxes.forEach(cb => {
        cb.addEventListener('change', () => {
            const checkedCount = [...checkboxes].filter(c => c.checked).length;

            // Wenn nur noch 1 Checkbox aktiv ist und man sie deaktivieren will, verhindere es
            if (checkedCount === 0) {
                cb.checked = true;
            }
        });
    });

    const toggle = document.getElementById("themeToggle");
    const body = document.body;
    const logo = document.getElementById("logo");

    function updateLogoTheme() {
        if (body.classList.contains("light-mode")) {
            logo.src = "img/white-mode-logo.svg";
        } else {
            logo.src = "img/logo.svg";
        }
    }

    // Lade Zustand aus localStorage
    if (localStorage.getItem("theme") === "light") {
        body.classList.add("light-mode");
        toggle.checked = false;
    } else {
        toggle.checked = true;
    }
    updateLogoTheme(); // ← Initialer Logo-Check

    toggle.addEventListener("change", () => {
        body.classList.toggle("light-mode");
        localStorage.setItem("theme", body.classList.contains("light-mode") ? "light" : "dark");
        updateLogoTheme(); // ← Logo aktualisieren
    });

    const tabRadios = document.querySelectorAll('input[name="tab"]');
    const tabContents = document.querySelectorAll('.tab-content');

    function updateTabs() {
        // Zuerst alle Inhalte verstecken und Animation resetten
        tabContents.forEach(content => {
            content.style.display = 'none';
            content.style.transition = '';
            content.style.opacity = '';
            content.style.transform = '';
        });

        const activeId = document.querySelector('input[name="tab"]:checked').id;
        const newIndex = parseInt(activeId.replace('tab', ''));
        const activeContent = document.querySelector(`.tab-content--${newIndex}`);

        if (activeContent) {
            const directionClass = newIndex > currentTabIndex ? 'right' : 'left';

            // Startzustand setzen
            activeContent.style.display = 'flex';
            activeContent.style.opacity = '0';
            activeContent.style.transform = directionClass === 'right' ? 'translateX(60px)' : 'translateX(-60px)';

            // Animieren
            requestAnimationFrame(() => {
                activeContent.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                activeContent.style.opacity = '1';
                activeContent.style.transform = 'translateX(0)';
            });

            // NICHT opacity/transform resetten – das bleibt sichtbar!
            currentTabIndex = newIndex;
        }
    }


    tabRadios.forEach(radio => {
        radio.addEventListener('change', updateTabs);
    });

    updateTabs();

    const tipData = {
        twofa: {
            icon: "img/2fa.png",
            title: "Nutze 2‑Faktor‑Authentifizierung",
            text: "Selbst wenn dein Passwort geknackt wird, schützt 2FA dein Konto zusätzlich."
        },
        personal: {
            icon: "img/personal-info.png",
            title: "Keine persönlichen Daten",
            text: "Geburtsdaten, Namen, Wohnorte oder Hobbys sind leicht zu erraten oder zu finden."
        },
        words: {
            icon: "img/words.png",
            title: "Vermeide bekannte Wörter",
            text: "Wörter wie „Passwort123“ oder „qwertz“ sind unsicher."
        },
        pwmanager: {
            icon: "img/passwordmanager.png",
            title: "Passwörter sicher speichern",
            text: "Verwende einen Passwortmanager – niemals Zettel oder unverschlüsselte Dateien."
        },
        keys: {
            icon: "img/keys.png",
            title: "Für jeden Dienst ein Passwort",
            text: "So bleiben andere Konten sicher, selbst wenn eines gehackt wird."
        },
        atwo: {
            icon: "img/a2.png",
            title: "Alle Zeichenarten nutzen",
            text: "Groß- und Kleinbuchstaben, Zahlen und Sonderzeichen erhöhen die Sicherheit."
        },
        calendar: {
            icon: "img/calendar.png",
            title: "Nur bei Bedarf ändern",
            text: "Regelmäßiges Ändern schwächt oft die Qualität. Ändere nur bei Verdacht."
        },
        phrase: {
            icon: "img/passphrase.png",
            title: "Passphrasen verwenden",
            text: "„Gelbe-TigerTanzt!2025“ ist sicher UND leicht zu merken."
        },
        qwertz: {
            icon: "img/qwertz.png",
            title: "Vermeide Muster & Wiederholungen",
            text: "Tastenkombis oder „aaaaaa“ sind vorhersehbar und unsicher."
        }
    };

    function openTipModal(key) {
        const data = tipData[key];
        if (!data) return;

        document.getElementById("modalIcon").src = data.icon;
        document.getElementById("modalTitle").textContent = data.title;
        document.getElementById("modalText").textContent = data.text;

        document.getElementById("tipModal").style.display = "block";
    }

    document.querySelectorAll(".tips-icon").forEach(icon => {
        icon.addEventListener("click", () => {
            const id = icon.id.replace("Icon", ""); // z. B. twofaIcon → twofa
            openTipModal(id);
        });
    });

    // Beispiel: Events registrieren
    document.getElementById("twofaIcon").addEventListener("click", () => openTipModal("twofa"));
    document.getElementById("wordsIcon").addEventListener("click", () => openTipModal("words"));
    // … und so weiter

    // ---- Modal Logic ----

    // Privacy Modal öffnen & schließen
    document.getElementById("adviseText").addEventListener("click", () => {
        document.getElementById("privacyModal").style.display = "block";
    });
    document.getElementById("closePrivacy").addEventListener("click", () => {
        document.getElementById("privacyModal").style.display = "none";
    });

    // Tip Modal schließen
    document.getElementById("closeTip").addEventListener("click", () => {
        document.getElementById("tipModal").style.display = "none";
    });

    // Schließen durch Klick neben das Modal
    document.querySelectorAll(".modal").forEach(modal => {
        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        });
    });


</script>


</body>
</html>
